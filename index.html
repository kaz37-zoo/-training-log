}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic",sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));overscroll-behavior-y:none}

button{touch-action:manipulation}

.hidden{display:none!important}
.app-header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid transparent;padding:8px 18px 10px}

main{max-width:680px;margin:auto;padding:0 16px 32px}
.page{display:none}.page.active{display:block}

.tabbar button.active{color:var(--accent)}.tabbar button.active svg .fillable{fill:currentColor}

.detail-header b{text-align:center;font-size:17px}.detail-header button{border:0;background:transparent;color:var(--accent);font-size:16px;min-height:42px}.detail-header button:last-child{text-align:right}
.detail-content{max-width:680px;margin:auto;padding:12px 16px 40px}

.setting-section{margin-top:22px}

.setting-row:last-child{border-bottom:0}
.setting-row .row-copy{flex:1}

.sheet-nav b{text-align:center;font-size:17px}.sheet-nav button{border:0;background:transparent;color:var(--accent);min-height:42px;font-weight:600}.sheet-nav button:last-child{text-align:right}
.form-section{margin:18px 16px 0}.form-section label{display:block;font-size:13px;color:var(--sub);margin:0 14px 7px}
.form-group{background:var(--surface);border-radius:12px;overflow:hidden}
.form-row{min-height:52px;padding:8px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.form-row:last-child{border-bottom:0}
.form-row span{font-size:15px}.form-row input,.form-row select,.form-row textarea{flex:1;min-width:0;border:0;background:transparent;text-align:right;outline:none;padding:7px 0}.form-row textarea{text-align:left;min-height:78px;resize:vertical}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px}.weekday{height:40px;border:0;border-radius:10px;background:var(--surface2);font-size:12px}.weekday.on{background:var(--accent);color:white}
.circuit-edit-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}.circuit-edit-row:last-child{border-bottom:0}.circuit-edit-row input{flex:1;border:0;background:transparent;outline:none}.circuit-edit-row button{width:40px;height:40px;border:0;background:transparent;color:var(--danger);font-size:22px}
.add-row{width:100%;height:50px;border:0;background:var(--surface);color:var(--accent);font-weight:700}
.timer{position:fixed;z-index:75;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));background:#262629;color:white;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.25);display:none;overflow:hidden}
.timer.show{display:block}.timer.compact .timer-expanded{display:none}
.timer-summary{min-height:60px;display:flex;align-items:center;gap:12px;padding:9px 12px}.timer-summary button{border:0;background:transparent;color:white}

.timer-expanded{border-top:1px solid rgba(255,255,255,.15);padding:12px}.timer-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.timer-actions button{height:44px;border:0;border-radius:11px;background:rgba(255,255,255,.12);color:white;font-weight:700}
.toast{position:fixed;z-index:150;left:50%;bottom:calc(95px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;background:#252528;color:white;border-radius:999px;padding:10px 15px;font-size:13px;font-weight:700;transition:.18s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.update-banner{display:none;margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);align-items:center;gap:10px}.update-banner.show{display:flex}.update-banner span{flex:1;font-size:13px}.update-banner button{border:0;background:var(--accent);color:white;border-radius:10px;height:38px;padding:0 14px;font-weight:700}
.offline{display:none;color:var(--warning);font-size:12px;font-weight:700}.offline.show{display:block}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media(max-width:390px){.set-line{grid-template-columns:39px 1fr 1fr 44px}.stepbox{grid-template-columns:32px 1fr 32px}}

.group>button.group-row,.history-list>button.group-row{display:flex;width:100%}
.setting-row,.group-row{box-sizing:border-box}

[data-theme="dark"]{--bg:#000;--surface:#1C1C1E;--surface2:#2C2C2E;--line:rgba(255,255,255,.16);--text:#fff;--sub:#C7C7CC;--muted:#8E8E93;--accent:#91C6A1;--accent-soft:#20372A;--danger:#FF6961;--warning:#FFD60A}

.sheet-panel{will-change:transform;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.sheet-panel.dragging{transition:none}
.sheet-handle{touch-action:none}
.menu-mode-badge{font-size:12px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:5px 8px;border-radius:8px}

/* v3.2 interaction, accessibility and performance polish */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-size:16px}
html[data-text-size="large"]{font-size:18px}
body{font-size:1rem}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 72%,white);outline-offset:3px}
button,.group-row,.setting-row{min-height:44px}
button:active{transform:scale(.975);opacity:.82}
.page.active{animation:pageIn .28s cubic-bezier(.22,.8,.3,1)}
.group,.exercise-row,.circuit-card{animation:cardIn .34s cubic-bezier(.22,.8,.3,1) both}
.exercise-row.done .set-check,.primary-pill.on{animation:checkPop .38s cubic-bezier(.2,1.45,.35,1)}

@keyframes pageIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

@keyframes checkPop{0%{transform:scale(.72)}60%{transform:scale(1.14)}100%{transform:scale(1)}}

@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}

 *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

 class="sheet" id="managerSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" onclick="sheetBackdrop(event)"><div class="sheet-panel" id="managerPanel"><div class="sheet-handle"></div><div class="sheet-nav"><button onclick="closeSheet()">キャンセル</button><b id="sheetTitle"></b><button id="sheetDone" onclick="saveSheet()">完了</button></div><div id="sheetBody"></div></div></div><div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div><div class="sr-only" id="a11yLive" role="status" aria-live="polite" aria-atomic="true"></div><div class="undo-toast" id="undoToast"><span id="undoText"></span><button onclick="undoLastDelete()">元に戻す</button></div><script>
const KEY='kaz-training-log-v2',OLD_KEY='kaz-training-log-v1',SETTINGS_KEY='kaz-training-settings-v2';

{id:'lower_circuit_hold',name:'スクワットキープ',group:'下半身サーキット',type:'reps',sets:1,weight:0,targetReps:0,rest:0,note:''}
];
const DEFAULT_CIRCUITS={

};
const DEFAULT_MENU_CONFIGS={
 upper:{name:'上半身メニュー',mode:'normal',description:'',days:['0','1','2','3','4','5','6']},
 abs:{name:'腹筋サーキット',mode:'circuit',description:'動画に合わせて実施',days:['0','1','2','3','4','5','6']},
 lower:{name:'下半身メニュー',mode:'normal',description:'',days:['0','1','2','3','4','5','6']},

const MENU_GROUPS={upper:['胸','背中','肩','腕'],abs:['腹筋'],lower:['脚','臀部','足'],lowerCircuit:['下半身サーキット']};

const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateKey=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
const fmtDate=d=>new Date(d+'T00:00:00').toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'long'});
const dayIndex=d=>new Date(d+'T00:00:00').getDay().toString();
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};

function loadSettings(){const base={autoTimer:true,collapseDone:true,wakeLock:false,theme:'system',textSize:'standard',haptics:true};try{const raw=JSON.parse(store.get(SETTINGS_KEY)||'{}')||{},v={...base,...raw};if(!['system','light','dark'].includes(v.theme))v.theme='system';return v}catch{return base}}
function loadState(){
 try{
  const raw=store.get(KEY)||store.get(OLD_KEY);
  const s=raw?JSON.parse(raw):{exercises:clone(DEFAULT_EXERCISES),sessions:[],deletedExerciseIds:[]};
  if(!Array.isArray(s.exercises))s.exercises=clone(DEFAULT_EXERCISES);
  if(!Array.isArray(s.sessions))s.sessions=[];
  if(!Array.isArray(s.deletedExerciseIds))s.deletedExerciseIds=[];
  DEFAULT_EXERCISES.forEach((ex,i)=>{if(!s.exercises.some(x=>x.id===ex.id)&&!s.deletedExerciseIds.includes(ex.id))s.exercises.push({...clone(ex),order:i})});
  s.exercises=s.exercises.map((e,i)=>({
   ...e,
   sets:Math.max(1,Number(e.sets)||3),
   weight:Math.max(0,Number(e.weight)||0),
   targetReps:Math.max(0,Number(e.targetReps??e.reps??((String(e.note||'').match(/(\d+)回/)||[])[1]))||0),
   rest:Math.max(0,Number(e.rest)||0),
   enabled:e.enabled!==false,
   useMenuDays:e.useMenuDays!==false,
   order:Number.isFinite(Number(e.order))?Number(e.order):i,
   days:Array.isArray(e.days)&&e.days.length?e.days.map(String):['0','1','2','3','4','5','6']
  }));
  if(!s.circuitDefs)s.circuitDefs=clone(DEFAULT_CIRCUITS);
  for(const k of ['abs','lower'])s.circuitDefs[k]={...clone(DEFAULT_CIRCUITS[k]),...(s.circuitDefs[k]||{}),items:Array.isArray(s.circuitDefs[k]?.items)?s.circuitDefs[k].items:clone(DEFAULT_CIRCUITS[k].items)};
  if(!s.menuConfigs)s.menuConfigs=clone(DEFAULT_MENU_CONFIGS);
  for(const k of ['upper','abs','lower','lowerCircuit']){
   const c=s.menuConfigs[k]||{};
   s.menuConfigs[k]={...clone(DEFAULT_MENU_CONFIGS[k]),...c,days:Array.isArray(c.days)&&c.days.length?c.days.map(String):clone(DEFAULT_MENU_CONFIGS[k].days)};
  }
  for(const kind of ['abs','lower']){
   const group=kind==='abs'?'腹筋':'脚',items=s.circuitDefs[kind]?.items||[];
   if(!s.exercises.some(e=>MENU_GROUPS[kind].includes(e.group))){
    items.forEach((name,i)=>s.exercises.push({id:`${kind}_legacy_${i}`,name,group,type:'reps',sets:1,weight:0,targetReps:0,rest:0,enabled:true,useMenuDays:true,order:i,note:'',days:clone(s.menuConfigs[kind].days)}))
   }
  }
  s.sessions=s.sessions.map(x=>{const y={...x,menuSnapshots:x.menuSnapshots||null,exerciseSnapshots:x.exerciseSnapshots||null};y.circuits=y.circuits||{};if(!y.circuits.lowerCircuit&&y.circuits.lower)y.circuits.lowerCircuit=clone(y.circuits.lower);y.circuits.lowerCircuit={completed:false,stops:0,note:'',...(y.circuits.lowerCircuit||{})};return y});
  return s
 }catch{
  return{exercises:clone(DEFAULT_EXERCISES).map((e,i)=>({...e,targetReps:0,enabled:true,useMenuDays:true,order:i,days:['0','1','2','3','4','5','6']})),sessions:[],deletedExerciseIds:[],circuitDefs:clone(DEFAULT_CIRCUITS),menuConfigs:clone(DEFAULT_MENU_CONFIGS)}
 }
}
let settings=loadSettings(),state=loadState(),today=dateKey(),selectedDate=today,activeTab='today',scrollPositions={today:0,history:0,settings:0};
let session=getSession(selectedDate),saveTimer=null,timerEnd=0,timerId=null,timerLabel='',detailDate=null,sheetMode=null,sheetData=null,wakeLock=null,waitingWorker=null,openExerciseIds=new Set(),openHistoryDates=new Set(),sheetDirty=false,lastDeletedSession=null,deleteTimer=null,historyReturnDate=null,lastSavedPayload='',saveIdleId=null,renderQueued=false;

function getSession(date){
 let s=state.sessions.find(x=>x.date===date);
 if(!s){s={date,log:{},circuits:{abs:{completed:false,stops:0,note:''},lower:{completed:false,stops:0,note:''},lowerCircuit:{completed:false,stops:0,note:''}},finished:false};state.sessions.push(s)}
 if(!s.log)s.log={};if(!s.circuits)s.circuits={};for(const k of ['upper','abs','lower','lowerCircuit'])s.circuits[k]={completed:false,stops:0,note:'',...(s.circuits[k]||{})};
 return s;
}
function menuKindForGroup(group){
 if(MENU_GROUPS.upper.includes(group))return'upper';
 if(MENU_GROUPS.abs.includes(group))return'abs';
 if(MENU_GROUPS.lowerCircuit.includes(group))return'lowerCircuit';
 return'lower'
}
function menuApplies(kind,date=selectedDate){return (state.menuConfigs?.[kind]?.days||DEFAULT_MENU_CONFIGS[kind].days).includes(dayIndex(date))}
function exercisesForMenu(kind,date=selectedDate){
 const d=dayIndex(date),menuDays=state.menuConfigs?.[kind]?.days||[];
 return state.exercises
  .filter(e=>e.enabled!==false&&MENU_GROUPS[kind].includes(e.group)&&((e.useMenuDays!==false&&menuDays.includes(d))||(e.useMenuDays===false&&(!e.days||e.days.includes(d)))))
  .sort((a,b)=>(a.order??999)-(b.order??999))
}
function applicableExercises(date=selectedDate){
 return ['upper','abs','lower','lowerCircuit'].flatMap(k=>exercisesForMenu(k,date))
}
function getSets(ex,s=session){
 const raw=s.log?.[ex.id],arr=Array.isArray(raw)?raw:(raw?.sets||[]);
 if(!arr.length){
  const previous=[...state.sessions].filter(x=>x.date<s.date&&x.log?.[ex.id]).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const oldRaw=previous?.log?.[ex.id],oldSets=Array.isArray(oldRaw)?oldRaw:(oldRaw?.sets||[]);
  if(oldSets.length)for(let i=0;i<ex.sets;i++){const v=oldSets[Math.min(i,oldSets.length-1)]||{};arr.push({w:Number(v.w??ex.weight)||0,r:Number(v.r??ex.targetReps)||0,done:false})}
 }
 while(arr.length<ex.sets)arr.push({w:Number(ex.weight)||0,r:Number(ex.targetReps)||0,done:false});
 s.log[ex.id]={sets:arr.slice(0,ex.sets)};return s.log[ex.id].sets
}
function exerciseDone(ex,s=session){
 const raw=s.log?.[ex.id],sets=Array.isArray(raw)?raw:(raw?.sets||[]);
 if(s!==session)return sets.length>0&&sets.every(x=>x.done);
 const current=getSets(ex,s);return current.length===ex.sets&&current.every(x=>x.done)
}
function hasData(s){return s.finished||Object.keys(s.log||{}).length||Object.values(s.circuits||{}).some(c=>c.completed||c.stops||c.note)}
function save(immediate=false){
 clearTimeout(saveTimer);
 const commit=()=>{
  const payload=JSON.stringify(state),settingsPayload=JSON.stringify(settings);
  if(payload!==lastSavedPayload){store.set(KEY,payload);lastSavedPayload=payload}
  store.set(SETTINGS_KEY,settingsPayload);
  const indicator=document.getElementById('saveState');indicator?.classList.add('show');
  setTimeout(()=>indicator?.classList.remove('show'),700);
  updateStorageUI()
 };
 if(immediate){commit();return}
 saveTimer=setTimeout(()=>{
  if('requestIdleCallback'in window)saveIdleId=requestIdleCallback(commit,{timeout:700});else commit()
 },180)
}
function flushSave(){
 clearTimeout(saveTimer);if(saveIdleId&&'cancelIdleCallback'in window)cancelIdleCallback(saveIdleId);

}
function toast(msg){
 const t=document.getElementById('toast'),live=document.getElementById('a11yLive');
 t.textContent=msg;t.classList.add('show');if(live)live.textContent=msg;
 clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),1800)
}
function vibrate(ms=20){
 if(settings.haptics===false)return;
 try{navigator.vibrate?.(ms)}catch{}
}
function haptic(type='light'){
 const map={light:12,medium:22,success:[18,35,18],warning:[28,35,28]};
 vibrate(map[type]||12)
}

function applyTheme(){
 const dark=settings.theme==='dark'||(settings.theme==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);
 document.documentElement.dataset.theme=dark?'dark':'light';
 document.documentElement.dataset.textSize=settings.textSize==='large'?'large':'standard';
 document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]')?.setAttribute('content',dark?'black-translucent':'default');
 const tv=document.getElementById('themeValue');if(tv)tv.textContent={system:'システム',light:'ライト',dark:'ダーク'}[settings.theme];
 const sv=document.getElementById('textSizeValue');if(sv)sv.textContent=settings.textSize==='large'?'大きめ':'標準'
}
function cycleTextSize(){settings.textSize=settings.textSize==='large'?'standard':'large';save();applyTheme();haptic('light');toast(`文字サイズ：${settings.textSize==='large'?'大きめ':'標準'}`)}
function cycleTheme(){haptic('light');settings.theme=settings.theme==='system'?'light':settings.theme==='light'?'dark':'system';store.set(SETTINGS_KEY,JSON.stringify(settings));applyTheme();renderSettings();toast(`外観：${{system:'システム',light:'ライト',dark:'ダーク'}[settings.theme]}`)}

function selectTab(tab){

 if(activeTab===tab){window.scrollTo({top:0,behavior:'smooth'});return}
 scrollPositions[activeTab]=scrollY;activeTab=tab;
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById(tab+'Page').classList.add('active');
 document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));

}
function updateHeader(){
 const titles={today:selectedDate===today?'今日':fmtDate(selectedDate),history:'履歴',settings:'設定'};
 document.getElementById('largeTitle').textContent=titles[activeTab];
 document.getElementById('compactTitle').textContent=titles[activeTab];
 document.getElementById('largeSubtitle').textContent=activeTab==='today'?(selectedDate===today?fmtDate(today):'過去のトレーニングを編集中'):activeTab==='history'?'トレーニング記録':'';
 const left=document.getElementById('headerLeft');
 if(activeTab==='today'&&selectedDate!==today){left.textContent=historyReturnDate?'履歴へ戻る':'今日へ戻る';left.onclick=historyReturnDate?returnToHistory:returnToToday}else{left.textContent='';left.onclick=null}
}
addEventListener('scroll',()=>document.getElementById('appHeader').classList.toggle('compact',scrollY>42),{passive:true});

function render(){
 if(renderQueued)return;renderQueued=true;
 requestAnimationFrame(()=>{
  renderQueued=false;updateHeader();
  if(activeTab==='today')renderToday();
  else if(activeTab==='history')renderHistory();
  else renderSettings();
  postRenderAccessibility()

}
function renderToday(){
 const normalKinds=['upper','abs','lower','lowerCircuit'].filter(k=>menuApplies(k)&&state.menuConfigs[k].mode==='normal');
 const circuitKinds=['upper','abs','lower','lowerCircuit'].filter(k=>menuApplies(k)&&state.menuConfigs[k].mode==='circuit');
 const normalExs=normalKinds.flatMap(k=>exercisesForMenu(k));
 const done=normalExs.filter(ex=>exerciseDone(ex)).length,cDone=circuitKinds.filter(k=>session.circuits[k]?.completed).length;
 const total=normalExs.length+circuitKinds.length,complete=done+cDone,pct=total?Math.round(complete/total*100):0;
 document.getElementById('progressPercent').textContent=pct+'%';document.getElementById('progressBar').style.width=pct+'%';
 document.getElementById('progressDetail').textContent=`${complete} / ${total} 完了`;
 const ux=normalKinds.includes('upper')?exercisesForMenu('upper'):[],ax=normalKinds.includes('abs')?exercisesForMenu('abs'):[],lx=normalKinds.includes('lower')?exercisesForMenu('lower'):[];

   ${ex.type==='wr'?stepBox(ex.id,i,'w',s.w,'kg',.5):'<div></div>'}

function historyMenuSummary(s,kind,config){
 if(config.mode==='circuit'){
  const c=s.circuits?.[kind]||{};
  return `${config.name} ${c.completed?'完走':'未完了'}${c.stops?`・停止${c.stops}回`:''}`
 }

 const done=ids.filter(id=>{const raw=s.log?.[id],sets=Array.isArray(raw)?raw:(raw?.sets||[]);return sets.length&&sets.every(x=>x.done)}).length;
 return `${config.name} ${done}/${ids.length}`

function saveSheet(){
 if(sheetMode==='pastDate'){openSelectedPastDate();return}
 if(sheetMode==='exercise'){
  const e=sheetData.ex;e.name=document.getElementById('fName').value.trim();e.group=document.getElementById('fGroup').value;e.type=document.getElementById('fType').value;e.sets=Math.max(1,Number(document.getElementById('fSets').value)||3);e.weight=Math.max(0,Number(document.getElementById('fWeight').value)||0);e.targetReps=Math.max(0,Number(document.getElementById('fTargetReps').value)||0);e.rest=Math.max(0,Number(document.getElementById('fRest').value)||0);e.note=document.getElementById('fNote').value.trim();e.enabled=sheetData.ex.enabled!==false;e.useMenuDays=sheetData.ex.useMenuDays!==false;
  if(!e.name||(e.useMenuDays===false&&!e.days?.length)){alert('種目名と実施曜日を設定してください');return}
  sheetData.list[sheetData.index]=e;
  const kind=sheetData.kind,config=sheetData.config,list=sheetData.list;
  sheetMode='menu';sheetData={kind,config,list};
  document.getElementById('sheetTitle').textContent=config.name;renderMenuManager();toast('種目を反映しました');return
 }else if(sheetMode==='menu'){
  const name=document.getElementById('menuName').value.trim(),mode=document.getElementById('menuMode').value,description=document.getElementById('menuDescription').value.trim();
  if(!name||!sheetData.config.days.length){alert('メニュー名と実施曜日を設定してください');return}
  sheetData.config={...sheetData.config,name,mode,description};state.menuConfigs[sheetData.kind]=sheetData.config;
  const managedGroups=MENU_GROUPS[sheetData.kind];state.exercises=[...state.exercises.filter(x=>!managedGroups.includes(x.group)),...sheetData.list]
 }
 else if(sheetMode==='circuit'){const d=sheetData.data;d.name=document.getElementById('cName').value.trim();d.description=document.getElementById('cDesc').value.trim();d.items=d.items.map(x=>x.trim()).filter(Boolean);if(!d.name||!d.items.length){alert('名称と種目を1つ以上設定してください');return}state.circuitDefs[sheetData.key]=d}
 save();sheetDirty=false;closeSheet(true);render();toast('保存しました')
}

function playFinishBeep(){
 try{
  const C=window.AudioContext||window.webkitAudioContext,ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sine';o.frequency.setValueAtTime(880,ctx.currentTime);g.gain.setValueAtTime(.0001,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(.16,ctx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.22);
  o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.23);o.onended=()=>ctx.close();
 }catch{}
}

function startTimer(sec,label){stopTimer(false);timerEnd=Date.now()+sec*1000;timerLabel=label;document.getElementById('timer').classList.add('show','compact');tickTimer();timerId=setInterval(tickTimer,250)}
function tickTimer(){const left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));document.getElementById('timerText').textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;document.getElementById('timerNext').textContent=timerLabel||'休憩中';if(left<=0){stopTimer();vibrate([80,60,80]);playFinishBeep();toast('休憩終了')}}
function adjustTimer(sec){timerEnd+=sec*1000;tickTimer()}
function stopTimer(hide=true){clearInterval(timerId);timerId=null;if(hide!==false)document.getElementById('timer').classList.remove('show')}
function toggleTimerExpanded(){document.getElementById('timer').classList.toggle('compact')}


function compactState(input=state){
 const s=clone(input);
 s.sessions=(s.sessions||[]).filter(x=>hasData(x)||x.finished).map(x=>{
  const used=new Set(Object.keys(x.log||{}));
  if(x.exerciseSnapshots)x.exerciseSnapshots=Object.fromEntries(Object.entries(x.exerciseSnapshots).filter(([id])=>used.has(id)));
  if(x.menuSnapshots)for(const k of Object.keys(x.menuSnapshots)){const m=x.menuSnapshots[k];if(Array.isArray(m.exerciseIds))m.exerciseIds=m.exerciseIds.filter(id=>used.has(id))}
  return x
 });
 s.deletedExerciseIds=[...new Set(s.deletedExerciseIds||[])];
 return s
}

function runDiagnostics(showResult=false){
 const checks=[];
 const add=(name,ok)=>checks.push({name,ok:!!ok});
 add('localStorage書き込み',(()=>{try{localStorage.setItem('__tltest','1');localStorage.removeItem('__tltest');return true}catch{return false}})());
 add('メニュー設定',!!state.menuConfigs&&['upper','abs','lower','lowerCircuit'].every(k=>state.menuConfigs[k]));
 add('種目ID重複なし',new Set(state.exercises.map(e=>e.id)).size===state.exercises.length);
 add('日付形式',state.sessions.every(s=>/^\d{4}-\d{2}-\d{2}$/.test(s.date)));
 add('セッション日付重複なし',new Set(state.sessions.map(s=>s.date)).size===state.sessions.length);
 add('サービスワーカー','serviceWorker'in navigator);
 add('オフラインキャッシュ',!!navigator.serviceWorker?.controller);
 add('Wake Lock','wakeLock'in navigator);
 add('アクセシビリティライブ領域',!!document.getElementById('a11yLive'));
 add('データ容量5MB未満',new Blob([JSON.stringify(state)]).size<5*1024*1024);
 const passed=checks.filter(x=>x.ok).length,el=document.getElementById('diagnosticValue');
 if(el){el.textContent=`${passed}/${checks.length}項目正常`;el.className=passed===checks.length?'diagnostic-pass':'diagnostic-warn'}
 if(showResult)alert(checks.map(x=>`${x.ok?'✓':'△'} ${x.name}`).join('\n')+`\n\n${passed}/${checks.length}項目正常`);
 return checks
}

function migrateLegacyBackup(x){
 if(x?.state?.sessions&&x?.state?.exercises)return{state:x.state,settings:x.settings||null};
 if(x?.sessions&&x?.exercises)return{state:x,settings:null};
 const src=x?.history||x?.records||x?.workouts;
 if(!src)throw 0;
 const entries=Array.isArray(src)?src:Object.entries(src).map(([date,v])=>({date,...v})),sessions=[];
 for(const item of entries){
  const date=item.date||item.day;if(!date)continue;
  const s={date,log:{},circuits:{abs:{completed:false,stops:0,note:''},lower:{completed:false,stops:0,note:''},lowerCircuit:{completed:false,stops:0,note:''}},finished:true,exerciseSnapshots:{}};
  const logs=item.log||item.exercises||item.upper||{};
  if(Array.isArray(logs))for(const ex of logs){const id=ex.id||('legacy_'+Math.random().toString(36).slice(2)),sets=(ex.sets||[]).map(v=>({w:Number(v.w??v.weight??0),r:Number(v.r??v.reps??0),done:v.done!==false}));s.log[id]={sets};s.exerciseSnapshots[id]={name:ex.name||'旧バックアップ種目',group:ex.group||'その他',type:ex.type||'reps',sets:sets.length}}
  else for(const [id,val] of Object.entries(logs)){const arr=Array.isArray(val)?val:(val?.sets||[]);s.log[id]={sets:arr.map(v=>({w:Number(v.w??v.weight??0),r:Number(v.r??v.reps??v??0),done:v.done!==false}))}}
  const a=item.abs||item.circuits?.abs,l=item.lower||item.legs||item.circuits?.lower;
  if(a)s.circuits.abs={completed:!!(a.completed??a.done??a),stops:Number(a.stops||0),note:a.note||''};
  if(l)s.circuits.lower={completed:!!(l.completed??l.done??l),stops:Number(l.stops||0),note:l.note||''};
  sessions.push(s)
 }
 return{state:{exercises:clone(DEFAULT_EXERCISES),sessions,deletedExerciseIds:[],circuitDefs:clone(DEFAULT_CIRCUITS)},settings:null}
}
function importData(e){
 const f=e.target.files?.[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   store.set('kaz-training-preimport-backup',JSON.stringify({savedAt:new Date().toISOString(),state,settings}));
   const m=migrateLegacyBackup(JSON.parse(r.result));
   state=m.state;settings={...settings,...(m.settings||{})};
   if(!state.circuitDefs)state.circuitDefs=clone(DEFAULT_CIRCUITS);
   if(!state.menuConfigs)state.menuConfigs=clone(DEFAULT_MENU_CONFIGS);
   store.set(KEY,JSON.stringify(state));store.set(SETTINGS_KEY,JSON.stringify(settings));location.reload()
  }catch{
   alert('この形式は自動変換できません。現在データは変更されていません。過去の日付入力から追加してください')
  }
 };
 r.readAsText(f);e.target.value=''
}
if('serviceWorker'in navigator){
 navigator.serviceWorker.register('./sw.js').then(reg=>{
  const show=w=>{
   if(!w||sessionStorage.getItem('tl-update-applied')==='1')return;
   waitingWorker=w;document.getElementById('updateBanner').classList.add('show');
   document.getElementById('a11yLive').textContent='新しいバージョンを利用できます'
  };
  if(reg.waiting)show(reg.waiting);
  reg.addEventListener('updatefound',()=>{const w=reg.installing;w?.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)show(w)})});
  setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})})
 }).catch(()=>{});
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(sessionStorage.getItem('tl-update-applied')==='1')location.reload()})
}
