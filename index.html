<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6F927E">
<title>トレログ</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="トレログ">
<style>
:root{
 --bg:#F5F6F3;--surface:#fff;--surface2:#EEF2ED;--line:#DDE5DD;
 --text:#172019;--sub:#6D776F;--muted:#98A199;--accent:#6F927E;
 --accent-deep:#456454;--accent-soft:#E5EEE8;--danger:#B74A44;
 --shadow:0 6px 20px rgba(38,55,45,.07);--r:18px
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit}
button{touch-action:manipulation}
header{padding:18px 18px 12px;background:rgba(245,246,243,.92);backdrop-filter:blur(18px);position:sticky;top:0;z-index:30}
.headline{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-size:25px;margin:0;letter-spacing:-.03em}
.date{font-size:13px;color:var(--sub);margin-top:4px}
.saved{font-size:12px;color:var(--accent-deep);opacity:0;transition:.2s}
.saved.show{opacity:1}
main{padding:4px 14px 28px;max-width:640px;margin:auto}
.page{display:none}.page.active{display:block}
.progress-card,.section-card,.exercise,.circuit,.history-card,.settings-card{background:var(--surface);border:1px solid rgba(111,146,126,.12);box-shadow:var(--shadow);border-radius:var(--r)}
.progress-card{padding:16px;margin-bottom:14px}
.progress-top{display:flex;justify-content:space-between;align-items:center}
.progress-top b{font-size:16px}.progress-top span{font-size:13px;color:var(--sub)}
.bar{height:9px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:.25s}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.summary{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.summary strong{display:block;font-size:15px}.summary small{font-size:11px;color:var(--sub)}
.section-title{font-size:13px;color:var(--sub);font-weight:800;letter-spacing:.08em;margin:20px 4px 9px}
.exercise{margin-bottom:10px;overflow:hidden}
.exercise.done{background:#F0F5F1}
.ex-head{width:100%;border:0;background:transparent;padding:15px;display:flex;align-items:center;gap:12px;text-align:left}
.status{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:white;font-weight:900}
.exercise.done .status{background:var(--accent);border-color:var(--accent)}
.ex-copy{flex:1;min-width:0}.ex-copy b{font-size:16px}.ex-copy small{display:block;color:var(--sub);font-size:12px;margin-top:3px}
.chev{color:var(--muted)}
.ex-body{padding:0 12px 14px}
.exercise.done:not(.open) .ex-body{display:none}
.set-row{display:grid;grid-template-columns:58px 1fr 1fr 52px;gap:8px;align-items:center;padding:8px;border-radius:14px;background:var(--surface2);margin-top:8px;min-height:58px}
.set-row.done{background:var(--accent-soft)}
.set-label{font-size:12px;font-weight:800;color:var(--sub)}
.value-box{height:44px;background:white;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:4px}
.value-box input{width:52px;border:0;background:transparent;text-align:right;font-size:18px;font-weight:800;color:var(--text);outline:none}
.value-box span{font-size:12px;color:var(--sub)}
.done-btn{height:44px;border-radius:12px;border:0;background:white;color:var(--accent-deep);font-size:21px;font-weight:900}
.set-row.done .done-btn{background:var(--accent);color:white}
.ex-actions{display:flex;gap:8px;margin-top:10px}
.sub-btn{min-height:44px;flex:1;border:1px solid var(--line);background:white;border-radius:12px;color:var(--sub);font-size:13px;font-weight:700}
.circuit{padding:16px;margin-bottom:12px}
.circuit-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.circuit h3{margin:0;font-size:18px}.circuit p{margin:4px 0 0;color:var(--sub);font-size:12px;line-height:1.5}
.complete-toggle{min-width:112px;height:48px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);font-weight:800;color:var(--sub)}
.complete-toggle.on{background:var(--accent);border-color:var(--accent);color:white}
.stop-row{margin-top:14px;display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border-radius:14px;padding:8px 10px 8px 14px}
.stop-row span{font-size:14px;font-weight:700}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:12px;border:0;background:white;font-size:22px;color:var(--accent-deep)}
.stepper b{min-width:32px;text-align:center;font-size:19px}
.circuit-note{width:100%;margin-top:10px;min-height:44px;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;resize:vertical}
.finish-btn{width:100%;min-height:54px;border:0;border-radius:16px;background:var(--accent-deep);color:white;font-size:16px;font-weight:900;margin-top:18px}
.finish-btn:disabled{opacity:.35}
.timerbar{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:50;background:var(--accent-deep);color:white;border-radius:18px;padding:10px 12px;box-shadow:0 10px 30px rgba(45,70,55,.25);display:none}
.timerbar.show{display:flex;align-items:center;gap:8px}
.timerbar.warn{background:#9A6A2F}
.time-main{flex:1}.time-main small{display:block;opacity:.8}.time-main b{font-size:22px}
.timerbar button{height:42px;min-width:54px;border:0;border-radius:12px;background:rgba(255,255,255,.16);color:white;font-weight:800}
nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 12px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
nav button{border:0;background:transparent;color:var(--muted);min-height:54px;border-radius:14px;font-size:12px;font-weight:800}
nav button span{display:block;font-size:20px;margin-bottom:2px}
nav button.active{background:var(--accent-soft);color:var(--accent-deep)}
.history-card,.settings-card{padding:15px;margin-bottom:10px}
.hist-head{display:flex;justify-content:space-between;gap:12px}
.hist-head b{font-size:16px}.hist-head span{font-size:12px;color:var(--sub)}
.hist-details{margin-top:10px;font-size:13px;color:var(--sub);line-height:1.8}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:0}
.setting-row label{font-size:14px;font-weight:700}.setting-row small{display:block;color:var(--sub);font-weight:400;margin-top:3px}
.toggle{width:52px;height:31px;border:0;border-radius:999px;background:#CED6CF;padding:3px}.toggle i{display:block;width:25px;height:25px;border-radius:50%;background:white;transition:.2s}.toggle.on{background:var(--accent)}.toggle.on i{transform:translateX(21px)}
.action-btn{width:100%;min-height:48px;border:1px solid var(--line);border-radius:13px;background:white;color:var(--text);font-weight:800;margin-top:8px}.action-btn.danger{color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:36px 10px}
.modal{position:fixed;inset:0;background:rgba(18,30,22,.42);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-card{width:min(100%,420px);background:white;border-radius:24px;padding:24px;text-align:center}
.modal-card h2{font-size:25px;margin:0}.modal-card p{color:var(--sub);line-height:1.7}.modal-card button{width:100%;height:50px;border:0;border-radius:14px;background:var(--accent);color:white;font-weight:900}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#203126;color:white;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:100;font-size:13px;font-weight:800}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:390px){.set-row{grid-template-columns:52px 1fr 1fr 48px;gap:6px}.value-box input{width:42px}.summary-grid{gap:6px}}

.manage-list{display:flex;flex-direction:column;gap:9px}
.manage-item{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;border:1px solid var(--line);background:white;border-radius:15px;padding:11px 12px;text-align:left}
.drag{color:var(--muted);font-size:20px}.manage-copy{flex:1;min-width:0}.manage-copy b{font-size:15px}.manage-copy small{display:block;color:var(--sub);font-size:12px;margin-top:3px}.manage-arrow{color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:110;background:rgba(18,30,22,.42);display:none;align-items:flex-end}
.sheet.show{display:flex}
.sheet-card{width:100%;max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 14px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -18px 50px rgba(20,35,25,.2)}
.sheet-handle{width:42px;height:5px;border-radius:999px;background:#C7D0C9;margin:2px auto 14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheet-head h2{font-size:20px;margin:0}.sheet-close{width:42px;height:42px;border:0;border-radius:50%;background:var(--surface2);font-size:19px}
.form-card{background:white;border-radius:17px;border:1px solid var(--line);padding:14px;margin-bottom:12px}
.form-card h3{font-size:13px;color:var(--sub);letter-spacing:.06em;margin:0 0 12px}
.field{margin-bottom:12px}.field:last-child{margin-bottom:0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:10px 12px;color:var(--text)}.field textarea{min-height:82px;resize:vertical}
.inline-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekday{height:42px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);font-size:12px;font-weight:800;color:var(--sub)}.weekday.on{background:var(--accent);border-color:var(--accent);color:white}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding-top:20px}.sheet-actions button{min-height:52px;border-radius:14px;font-weight:900}.save-ex{border:0;background:var(--accent);color:white}.delete-ex{border:1px solid #E7C5C2;background:white;color:var(--danger)}
.history-card button.hist-toggle{width:100%;border:0;background:transparent;padding:0;text-align:left;color:inherit}.history-card.collapsed .hist-details{display:none}.history-card.collapsed{padding-bottom:15px}
.category-title{font-size:12px;color:var(--sub);font-weight:900;letter-spacing:.08em;margin:3px 0 10px}
.setting-note{font-size:12px;color:var(--sub);line-height:1.6;margin-top:8px}

</style>
</head>
<body>
<header>
 <div class="headline"><div><h1>トレログ</h1><div class="date" id="todayLabel"></div></div><div class="saved" id="saved">保存済み</div></div>
</header>
<main>
<section id="todayPage" class="page active">
 <div class="progress-card">
  <div class="progress-top"><b>今日の進捗</b><span id="progressText">0%</span></div>
  <div class="bar"><i id="progressBar"></i></div>
  <div class="summary-grid">
   <div class="summary"><strong id="upperSummary">0/0</strong><small>上半身</small></div>
   <div class="summary"><strong id="absSummary">―</strong><small>腹筋</small></div>
   <div class="summary"><strong id="lowerSummary">―</strong><small>下半身</small></div>
  </div>
 </div>
 <div class="section-title">上半身</div>
 <div id="upperList"></div>
 <div class="section-title">腹筋サーキット</div>
 <div id="absCircuit"></div>
 <div class="section-title">下半身サーキット</div>
 <div id="lowerCircuit"></div>
 <button class="finish-btn" id="finishBtn" onclick="finishWorkout()">今日のトレーニングを終了</button>
</section>

<section id="historyPage" class="page">
 <div class="section-title">トレーニング履歴</div>
 <div id="historyList"></div>
</section>

<section id="morePage" class="page">
 <div class="section-title">種目管理</div>
 <div class="settings-card">
  <div class="category-title">上半身メニュー</div>
  <div id="manageList" class="manage-list"></div>
  <button class="action-btn" onclick="openExerciseSheet()">＋ 種目を追加</button>
 </div>

 <div class="section-title">トレーニング</div>
 <div class="settings-card">
  <div class="setting-row"><label>セット完了後に自動休憩<small>上半身のセットを完了すると開始</small></label><button id="autoToggle" class="toggle" onclick="toggleSetting('autoTimer')"><i></i></button></div>
  <div class="setting-row"><label>完了種目を自動で折りたたむ<small>今日の画面を短く保ちます</small></label><button id="collapseToggle" class="toggle" onclick="toggleSetting('collapseDone')"><i></i></button></div>
 </div>

 <div class="section-title">表示</div>
 <div class="settings-card">
  <div class="setting-row"><label>進捗表示<small>上半身・腹筋・下半身を表示</small></label><b>常に表示</b></div>
  <div class="setting-row"><label>文字サイズ<small>iPhoneで押しやすい大きさに固定</small></label><b>標準</b></div>
 </div>

 <div class="section-title">データ</div>
 <div class="settings-card">
  <button class="action-btn" onclick="exportData()">バックアップを書き出す</button>
  <button class="action-btn" onclick="document.getElementById('importFile').click()">バックアップを読み込む</button>
  <input id="importFile" hidden type="file" accept="application/json" onchange="importData(event)">
  <p class="setting-note">記録は端末内に保存されます。Safariのデータ削除や端末変更に備えて、定期的なバックアップを推奨します。</p>
 </div>

 <div class="section-title">リセット</div>
 <div class="settings-card">
  <button class="action-btn danger" onclick="resetToday()">今日の入力だけリセット</button>
 </div>

 <div class="section-title">アプリ情報</div>
 <div class="settings-card"><div class="setting-row"><label>バージョン</label><b>2.2.1</b></div></div>
</section>
</main>

<div class="timerbar" id="timerbar">
 <div class="time-main"><small>休憩中</small><b id="timerText">01:30</b></div>
 <button onclick="adjustTimer(-15)">−15</button><button onclick="stopTimer()">終了</button><button onclick="adjustTimer(15)">＋15</button>
</div>

<nav>
 <button class="active" data-page="today" onclick="showPage('today')"><span>●</span>今日</button>
 <button data-page="history" onclick="showPage('history')"><span>▤</span>履歴</button>
 <button data-page="more" onclick="showPage('more')"><span>•••</span>その他</button>
</nav>


<div class="sheet" id="exerciseSheet" onclick="sheetBackdrop(event)">
 <div class="sheet-card">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h2 id="sheetTitle">種目を編集</h2><button class="sheet-close" onclick="closeExerciseSheet()">×</button></div>

  <div class="form-card">
   <h3>基本</h3>
   <div class="field"><label>種目名</label><input id="editName" placeholder="例：ダンベルフライ"></div>
   <div class="inline-fields">
    <div class="field"><label>部位</label><select id="editGroup"><option>胸</option><option>背中</option><option>肩</option><option>腕</option></select></div>
    <div class="field"><label>記録方法</label><select id="editType"><option value="wr">重量＋回数</option><option value="reps">回数のみ</option></select></div>
   </div>
  </div>

  <div class="form-card">
   <h3>トレーニング</h3>
   <div class="inline-fields">
    <div class="field"><label>セット数</label><input id="editSets" type="number" inputmode="numeric" min="1" max="10"></div>
    <div class="field"><label>初期重量（kg）</label><input id="editWeight" type="number" inputmode="decimal" step="0.5" min="0"></div>
   </div>
   <div class="field"><label>休憩時間（秒）</label><input id="editRest" type="number" inputmode="numeric" min="0" max="600"></div>
  </div>

  <div class="form-card">
   <h3>実施曜日</h3>
   <div class="weekdays" id="weekdayButtons"></div>
  </div>

  <div class="form-card">
   <h3>メモ</h3>
   <div class="field"><textarea id="editNote" placeholder="フォームや回数の目安"></textarea></div>
  </div>

  <div class="sheet-actions">
   <button class="delete-ex" id="deleteExerciseBtn" onclick="deleteExercise()">削除</button>
   <button class="save-ex" onclick="saveExerciseEdit()">保存</button>
  </div>
 </div>
</div>

<div class="modal" id="completeModal"><div class="modal-card">
 <h2>トレーニング完了</h2>
 <p id="completeText"></p>
 <button onclick="document.getElementById('completeModal').classList.remove('show')">閉じる</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='kaz-training-log-v2', OLD_KEY='kaz-training-log-v1', SETTINGS_KEY='kaz-training-settings-v2';
const CIRCUIT_IDS={abs:'circuit_abs',lower:'circuit_lower'};
const DEFAULT_EXERCISES=[
{id:'pushup',name:'プッシュアップ',group:'胸',type:'reps',sets:3,weight:0,rest:90,note:'10回×3セット'},
{id:'widepushup',name:'ワイドプッシュアップ',group:'胸',type:'reps',sets:3,weight:0,rest:90,note:'5回×2〜3セット'},
{id:'fly',name:'ダンベルフライ',group:'胸',type:'wr',sets:3,weight:5,rest:90,note:'5kg・10回×3セット'},
{id:'row',name:'ワンハンドロウ',group:'背中',type:'wr',sets:3,weight:5,rest:120,note:'左右5kg・15回×3セット'},
{id:'sideraise',name:'サイドレイズ',group:'肩',type:'wr',sets:3,weight:5,rest:60,note:'5kg・15回×3セット'},
{id:'rearraise',name:'リアレイズ',group:'肩',type:'wr',sets:3,weight:2,rest:60,note:'2kg・15回×3セット'},
{id:'curl',name:'ダンベルカール',group:'腕',type:'wr',sets:3,weight:5,rest:60,note:'左右5kg・15回×3セット'},
{id:'dips',name:'椅子ディップス',group:'腕',type:'reps',sets:3,weight:0,rest:60,note:'限界回数×3セット'}
];
const ABS_IDS=['leglift','kneetoe','crunch','russian','boat','reverse','pulse','bicycle'];
const LOWER_IDS=['slowsquat','fullsquat','boundsquat','jumpsquat','inoutsquat','jumplunge','squathold'];
const clone=o=>JSON.parse(JSON.stringify(o));
const dateKey=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
const fmtDate=d=>new Date(d+'T00:00:00').toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'long'});
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

function loadSettings(){try{const v=JSON.parse(store.get(SETTINGS_KEY)||'{}');return{autoTimer:true,collapseDone:true,...(v&&typeof v==='object'?v:{})}}catch(e){return{autoTimer:true,collapseDone:true}}}
let settings=loadSettings();
let state=loadState(), today=dateKey(), session=getSession(today), timerEnd=0,timerId=null,warned=false,saveTimer=null;

function loadState(){
 try{
  const raw=store.get(KEY)||store.get(OLD_KEY);
  const fresh=!raw;
  const s=raw?JSON.parse(raw):{exercises:clone(DEFAULT_EXERCISES),sessions:[],deletedExerciseIds:[]};
  if(!s||typeof s!=='object')throw new Error('invalid state');
  if(!Array.isArray(s.exercises))s.exercises=clone(DEFAULT_EXERCISES);
  if(!Array.isArray(s.sessions))s.sessions=[];
  if(!Array.isArray(s.deletedExerciseIds))s.deletedExerciseIds=[];
  if(!fresh)DEFAULT_EXERCISES.forEach(def=>{
   const exists=s.exercises.some(e=>e&&e.id===def.id);
   if(!exists&&!s.deletedExerciseIds.includes(def.id))s.exercises.push(clone(def));
  });
  s.exercises=s.exercises.filter(e=>e&&typeof e.id==='string'&&typeof e.name==='string');
  return s;
 }catch(e){return{exercises:clone(DEFAULT_EXERCISES),sessions:[],deletedExerciseIds:[]}}
}
function getSession(date){
 let s=state.sessions.find(x=>x.date===date);
 if(!s){s={date,log:{},meta:{},circuits:{}};state.sessions.push(s)}
 if(!s.log)s.log={}; if(!s.meta)s.meta={}; if(!s.circuits)s.circuits={};
 for(const ex of upperExercises()){
  if(!s.log[ex.id])s.log[ex.id]={sets:defaultSets(ex),note:'',skipped:false};
  if(Array.isArray(s.log[ex.id]))s.log[ex.id]={sets:s.log[ex.id],note:'',skipped:false};
  if(!Array.isArray(s.log[ex.id].sets))s.log[ex.id].sets=defaultSets(ex);
  while(s.log[ex.id].sets.length<(ex.sets||3))s.log[ex.id].sets.push(blankSet(ex));
 }
 for(const key of ['abs','lower'])if(!s.circuits[key])s.circuits[key]={completed:false,stops:0,note:''};
 return s;
}
function allUpperExercises(){
 return state.exercises.filter(e=>e&&!ABS_IDS.includes(e.id)&&!LOWER_IDS.includes(e.id)&&['胸','背中','肩','腕'].includes(e.group));
}
function upperExercises(){
 const day=String(new Date().getDay());
 return allUpperExercises().filter(e=>!Array.isArray(e.days)||e.days.length===0||e.days.includes(day));
}
function blankSet(ex){return ex.type==='wr'?{w:ex.weight||0,r:0,done:false}:{r:0,done:false}}
function defaultSets(ex){
 const previous=[...state.sessions].filter(s=>s.date<today&&s.log&&s.log[ex.id]).sort((a,b)=>b.date.localeCompare(a.date))[0];
 const prev=previous?.log?.[ex.id];
 const sets=Array.isArray(prev)?prev:prev?.sets;
 if(Array.isArray(sets)&&sets.length)return sets.slice(0,ex.sets||3).map(x=>({...x,done:false}));
 return Array.from({length:ex.sets||3},()=>blankSet(ex));
}
function persistNow(){clearTimeout(saveTimer);store.set(KEY,JSON.stringify(state));store.set(SETTINGS_KEY,JSON.stringify(settings))}
function save(){
 clearTimeout(saveTimer);
 saveTimer=setTimeout(()=>{
  persistNow();
  const el=document.getElementById('saved');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),900);
 },120);
}
function render(){
 document.getElementById('todayLabel').textContent=fmtDate(today);
 renderUpper();renderCircuit('abs');renderCircuit('lower');renderProgress();renderHistory();renderSettings();renderManageList();
}
function exComplete(ex){const e=session.log[ex.id];return !!e&&!e.skipped&&e.sets.slice(0,ex.sets||3).every(s=>s.done)}
function renderUpper(){
 const list=document.getElementById('upperList');
 const todays=upperExercises();if(!todays.length){list.innerHTML='<div class="empty">今日の上半身メニューはありません</div>';return}
 list.innerHTML=todays.map(ex=>{
  const entry=session.log[ex.id], done=exComplete(ex);
  const collapsed=done&&settings.collapseDone;
  return `<article class="exercise ${done?'done':''} ${collapsed?'':'open'}" id="ex-${ex.id}">
   <button class="ex-head" onclick="toggleExercise('${ex.id}')">
    <span class="status">${done?'✓':''}</span>
    <span class="ex-copy"><b>${escapeHtml(ex.name)}</b><small>${escapeHtml(ex.note||'')}</small></span><span class="chev">${collapsed?'⌄':'⌃'}</span>
   </button>
   <div class="ex-body">
    ${entry.sets.slice(0,ex.sets||3).map((s,i)=>setHtml(ex,s,i)).join('')}
    <div class="ex-actions"><button class="sub-btn" onclick="startTimer(${ex.rest??90})">休憩 ${ex.rest??90}秒</button><button class="sub-btn" onclick="skipExercise('${ex.id}')">${entry.skipped?'スキップ解除':'今日はスキップ'}</button></div>
   </div>
  </article>`
 }).join('');
}
function setHtml(ex,s,i){
 const wr=ex.type==='wr';
 return `<div class="set-row ${s.done?'done':''}">
  <div class="set-label">SET ${i+1}</div>
  ${wr?`<label class="value-box"><input inputmode="decimal" value="${s.w??ex.weight??0}" oninput="changeSet('${ex.id}',${i},'w',this.value)"><span>kg</span></label>`:''}
  <label class="value-box"><input inputmode="numeric" value="${s.r??0}" oninput="changeSet('${ex.id}',${i},'r',this.value)"><span>回</span></label>
  ${wr?'':`<div></div>`}
  <button class="done-btn" onclick="toggleSet('${ex.id}',${i})">${s.done?'✓':'○'}</button>
 </div>`
}
function changeSet(id,i,k,v){session.log[id].sets[i][k]=Number(v)||0;save()}
function toggleSet(id,i){
 const ex=upperExercises().find(e=>e.id===id), set=session.log[id].sets[i];
 set.done=!set.done;session.log[id].skipped=false;save();
 if(set.done&&settings.autoTimer&&(ex.rest??90)>0)startTimer(ex.rest??90);
 renderUpper();renderProgress();
 if(set.done)setTimeout(()=>scrollNext(),250);
}
function toggleExercise(id){document.getElementById('ex-'+id)?.classList.toggle('open')}
function skipExercise(id){session.log[id].skipped=!session.log[id].skipped;save();renderUpper();renderProgress()}
function scrollNext(){
 const current=upperExercises();
 const next=current.find(e=>!exComplete(e)&&!session.log[e.id].skipped);
 if(next)document.getElementById('ex-'+next.id)?.scrollIntoView({behavior:'smooth',block:'center'});
 else document.getElementById('absCircuit')?.scrollIntoView({behavior:'smooth',block:'center'});
}
function circuitLabel(key){return key==='abs'?{title:'腹筋サーキット',sub:'8種目を動画に合わせて実施'}:{title:'下半身サーキット',sub:'7種目を動画に合わせて実施'}}
function renderCircuit(key){
 const c=session.circuits[key], meta=circuitLabel(key), root=document.getElementById(key==='abs'?'absCircuit':'lowerCircuit');
 root.innerHTML=`<article class="circuit">
  <div class="circuit-top"><div><h3>${meta.title}</h3><p>${meta.sub}<br>止まらず完走できたかと、止まった回数だけ記録</p></div>
   <button class="complete-toggle ${c.completed?'on':''}" onclick="toggleCircuit('${key}')">${c.completed?'✓ 完走':'完走した'}</button>
  </div>
  <div class="stop-row"><span>止まった回数</span><div class="stepper"><button onclick="stepStops('${key}',-1)">−</button><b>${c.stops||0}</b><button onclick="stepStops('${key}',1)">＋</button></div></div>
  <textarea class="circuit-note" placeholder="メモ（任意）" onchange="setCircuitNote('${key}',this.value)">${escapeHtml(c.note||'')}</textarea>
 </article>`;
}
function toggleCircuit(key){session.circuits[key].completed=!session.circuits[key].completed;save();renderCircuit(key);renderProgress()}
function stepStops(key,d){session.circuits[key].stops=Math.max(0,(session.circuits[key].stops||0)+d);save();renderCircuit(key);renderProgress()}
function setCircuitNote(key,v){session.circuits[key].note=v;save()}
function progressData(){
 const exs=upperExercises(), upperDone=exs.filter(ex=>exComplete(ex)||session.log[ex.id].skipped).length;
 const abs=session.circuits.abs.completed, lower=session.circuits.lower.completed;
 const done=upperDone+(abs?1:0)+(lower?1:0), total=exs.length+2;
 return{upperDone,totalUpper:exs.length,abs,lower,done,total,pct:Math.round(done/total*100)}
}
function renderProgress(){
 const p=progressData();
 document.getElementById('progressText').textContent=p.pct+'%';
 document.getElementById('progressBar').style.width=p.pct+'%';
 document.getElementById('upperSummary').textContent=p.upperDone+'/'+p.totalUpper;
 document.getElementById('absSummary').textContent=p.abs?'✓':'―';
 document.getElementById('lowerSummary').textContent=p.lower?'✓':'―';
 document.getElementById('finishBtn').disabled=p.done===0;
}
function finishWorkout(){
 const p=progressData(),a=session.circuits.abs,l=session.circuits.lower;
 session.meta.finishedAt=new Date().toISOString();session.meta.upperSummary={done:p.upperDone,total:p.totalUpper};save();
 document.getElementById('completeText').innerHTML=`上半身 ${p.upperDone}/${p.totalUpper}<br>腹筋：${a.completed?'完走':'未完了'}・停止 ${a.stops||0}回<br>下半身：${l.completed?'完走':'未完了'}・停止 ${l.stops||0}回`;
 document.getElementById('completeModal').classList.add('show');renderHistory();
}
function historyUpperStats(s){
 if(s.meta?.upperSummary&&Number.isFinite(s.meta.upperSummary.done)&&Number.isFinite(s.meta.upperSummary.total))return s.meta.upperSummary;
 const entries=Object.entries(s.log||{}).filter(([id,e])=>!ABS_IDS.includes(id)&&!LOWER_IDS.includes(id)&&Array.isArray(Array.isArray(e)?e:e?.sets));
 let done=0,total=0;
 for(const [id,e] of entries){
  const sets=Array.isArray(e)?e:e.sets;
  if(!sets.length)continue;
  total++;
  if(!e?.skipped&&sets.every(x=>x&&x.done))done++;
 }
 return{done,total};
}
function renderHistory(){
 const root=document.getElementById('historyList');
 const sessions=[...state.sessions].filter(s=>hasData(s)).sort((a,b)=>b.date.localeCompare(a.date));
 if(!sessions.length){root.innerHTML='<div class="empty">まだ記録がありません</div>';return}
 root.innerHTML=sessions.map(s=>{
  const stats=historyUpperStats(s),done=stats.done,total=stats.total;
  const a=s.circuits?.abs||{},l=s.circuits?.lower||{};
  return `<article class="history-card collapsed" id="hist-${s.date}">
   <button class="hist-toggle" onclick="toggleHistory('${s.date}')">
    <div class="hist-head"><b>${fmtDate(s.date)}</b><span>上半身 ${done}/${total}　⌄</span></div>
   </button>
   <div class="hist-details">腹筋：${a.completed?'完走':'未完了'}／停止 ${a.stops||0}回<br>下半身：${l.completed?'完走':'未完了'}／停止 ${l.stops||0}回</div>
  </article>`
 }).join('');
}
function hasData(s){
 if(s.meta?.finishedAt)return true;
 if(s.circuits?.abs?.completed||s.circuits?.lower?.completed||s.circuits?.abs?.stops||s.circuits?.lower?.stops)return true;
 return Object.values(s.log||{}).some(e=>(Array.isArray(e)?e:e?.sets||[]).some(x=>x.done));
}

let editingExerciseId=null,editingDays=['1','3','5'];
function renderManageList(){
 const root=document.getElementById('manageList');if(!root)return;
 root.innerHTML=allUpperExercises().map(ex=>`<button class="manage-item" onclick="openExerciseSheet('${ex.id}')">
  <span class="drag">≡</span><span class="manage-copy"><b>${escapeHtml(ex.name)}</b><small>${escapeHtml(ex.group)}・${ex.type==='wr'?'重量＋回数':'回数のみ'}・${ex.sets||3}セット・休憩${ex.rest??0}秒</small></span><span class="manage-arrow">›</span>
 </button>`).join('');
}
function openExerciseSheet(id){
 editingExerciseId=id||null;
 const ex=id?state.exercises.find(e=>e.id===id):{name:'',group:'胸',type:'wr',sets:3,weight:0,rest:90,note:'',days:['0','1','2','3','4','5','6']};
 if(!ex)return;
 document.getElementById('sheetTitle').textContent=id?'種目を編集':'種目を追加';
 document.getElementById('editName').value=ex.name||'';
 document.getElementById('editGroup').value=ex.group||'胸';
 document.getElementById('editType').value=ex.type||'wr';
 document.getElementById('editSets').value=ex.sets||3;
 document.getElementById('editWeight').value=ex.weight||0;
 document.getElementById('editRest').value=ex.rest??90;
 document.getElementById('editNote').value=ex.note||'';
 editingDays=Array.isArray(ex.days)?[...ex.days]:['0','1','2','3','4','5','6'];
 renderWeekdays();
 document.getElementById('deleteExerciseBtn').style.visibility=id?'visible':'hidden';
 document.getElementById('exerciseSheet').classList.add('show');
}
function closeExerciseSheet(){document.getElementById('exerciseSheet').classList.remove('show')}
function sheetBackdrop(e){if(e.target.id==='exerciseSheet')closeExerciseSheet()}
function renderWeekdays(){
 const names=['日','月','火','水','木','金','土'];
 document.getElementById('weekdayButtons').innerHTML=names.map((n,i)=>`<button type="button" class="weekday ${editingDays.includes(String(i))?'on':''}" onclick="toggleDay('${i}')">${n}</button>`).join('');
}
function toggleDay(d){
 editingDays=editingDays.includes(d)?editingDays.filter(x=>x!==d):[...editingDays,d];
 renderWeekdays();
}
function saveExerciseEdit(){
 const name=document.getElementById('editName').value.trim();
 if(!name){alert('種目名を入力してください');return}
 if(editingDays.length===0){alert('実施曜日を1日以上選んでください');return}
 const data={
  name,group:document.getElementById('editGroup').value,
  type:document.getElementById('editType').value,
  sets:Math.max(1,Number(document.getElementById('editSets').value)||3),
  weight:Math.max(0,Number(document.getElementById('editWeight').value)||0),
  rest:Math.max(0,Number(document.getElementById('editRest').value)||0),
  note:document.getElementById('editNote').value.trim(),days:[...editingDays]
 };
 if(editingExerciseId){
  const ex=state.exercises.find(e=>e.id===editingExerciseId);if(!ex){alert('種目が見つかりません');return}Object.assign(ex,data);
 }else{
  data.id='custom_'+Date.now();state.exercises.push(data);
 }
 session=getSession(today);save();closeExerciseSheet();render();toast('種目を保存しました')
}
function deleteExercise(){
 if(!editingExerciseId||!confirm('この種目を削除しますか？'))return;
 state.exercises=state.exercises.filter(e=>e.id!==editingExerciseId);if(!Array.isArray(state.deletedExerciseIds))state.deletedExerciseIds=[];if(!state.deletedExerciseIds.includes(editingExerciseId))state.deletedExerciseIds.push(editingExerciseId);
 save();closeExerciseSheet();render();toast('種目を削除しました')
}
function toggleHistory(date){document.getElementById('hist-'+date)?.classList.toggle('collapsed')}

function renderSettings(){
 document.getElementById('autoToggle').classList.toggle('on',!!settings.autoTimer);
 document.getElementById('collapseToggle').classList.toggle('on',!!settings.collapseDone);
}
function toggleSetting(k){settings[k]=!settings[k];save();renderSettings();if(k==='collapseDone')renderUpper()}
function showPage(p){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 document.getElementById(p+'Page').classList.add('active');
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));
 if(p==='history')renderHistory();window.scrollTo({top:0,behavior:'smooth'});
}
function startTimer(sec){sec=Number(sec)||0;if(sec<=0){stopTimer();return}timerEnd=Date.now()+sec*1000;warned=false;clearInterval(timerId);timerId=setInterval(updateTimer,250);updateTimer()}
function updateTimer(){
 const left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000)),bar=document.getElementById('timerbar');
 if(left<=0){clearInterval(timerId);timerId=null;bar.classList.remove('show','warn');if(timerEnd){tone(880);setTimeout(()=>tone(1100),170);toast('休憩終了')}timerEnd=0;return}
 bar.classList.add('show');bar.classList.toggle('warn',left<=10);
 document.getElementById('timerText').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
 if(left<=10&&!warned){warned=true;tone(720);toast('あと10秒')}
}
function adjustTimer(v){timerEnd+=v*1000;updateTimer()}
function stopTimer(){timerEnd=0;updateTimer()}
function tone(freq){try{const A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},130)}catch(e){}}
function exportData(){
 const payload={version:'2.2.1',exportedAt:new Date().toISOString(),state,settings};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='training-log-'+today+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
}
function importData(ev){
 const f=ev.target.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{try{
  const d=JSON.parse(r.result),incoming=d.state||d;
  if(!incoming||typeof incoming!=='object'||!Array.isArray(incoming.exercises)||!Array.isArray(incoming.sessions))throw new Error('invalid backup');
  state=incoming;if(!Array.isArray(state.deletedExerciseIds))state.deletedExerciseIds=[];
  settings={...loadSettings(),...(d.settings&&typeof d.settings==='object'?d.settings:{})};
  session=getSession(today);persistNow();render();toast('読み込みました')
 }catch(e){alert('バックアップを読み込めませんでした')}};r.readAsText(f);ev.target.value=''
}
function resetToday(){
 if(!confirm('今日の入力をすべてリセットしますか？'))return;
 state.sessions=state.sessions.filter(s=>s.date!==today);session=getSession(today);save();render();toast('今日の入力をリセットしました')
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let toastId;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(toastId);toastId=setTimeout(()=>e.classList.remove('show'),1500)}
render();
window.addEventListener('pagehide',persistNow);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persistNow()});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
