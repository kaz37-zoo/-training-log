<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"><title>トレログ</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="トレログ"><style>
:root{

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.tabbar{position:fixed;z-index:70;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);padding:5px 18px calc(5px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line)}
.tabbar button{height:56px;border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabbar svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.active{color:var(--accent)}.tabbar button.active svg .fillable{fill:currentColor}
.history-list .group-row{cursor:pointer}
.history-date{font-size:16px;font-weight:700}.history-summary{font-size:12px;color:var(--sub);margin-top:4px}
.detail-page{position:fixed;inset:0;z-index:55;background:var(--bg);overflow:auto;padding-bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}

.setting-row:last-child{border-bottom:0}
.setting-row .row-copy{flex:1}
.toggle{width:51px;height:31px;padding:2px;border:0;border-radius:999px;background:#D1D1D6}.toggle i{display:block;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:.2s}.toggle.on{background:#34C759}.toggle.on i{transform:translateX(20px)}

.circuit-edit-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}.circuit-edit-row:last-child{border-bottom:0}.circuit-edit-row input{flex:1;border:0;background:transparent;outline:none}.circuit-edit-row button{width:40px;height:40px;border:0;background:transparent;color:var(--danger);font-size:22px}

.offline{display:none;color:var(--warning);font-size:12px;font-weight:700}.offline.show{display:block}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media(max-width:390px){.set-line{grid-template-columns:39px 1fr 1fr 44px}.stepbox{grid-template-columns:32px 1fr 32px}}

.group>button.group-row,.history-list>button.group-row{display:flex;width:100%}
.setting-row,.group-row{box-sizing:border-box}
.group-row .row-copy{flex:1;min-width:0}

.history-card{margin-bottom:12px}

 abs:{name:'腹筋サーキット',description:'動画に合わせて実施',items:['レッグリフト','ニートゥー','クランチ','ロシアンツイスト','ボート','リバースクランチ','パルスクランチ','バイシクルクランチ']},
 lower:{name:'下半身サーキット',description:'動画に合わせて実施',items:['スロースクワット','フルスクワット','バウンドスクワット','ジャンプスクワット','インアウトスクワット','ジャンプランジ','スクワットキープ']}
};
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateKey=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
const fmtDate=d=>new Date(d+'T00:00:00').toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'long'});
const dayIndex=d=>new Date(d+'T00:00:00').getDay().toString();
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};

function loadSettings(){try{return{autoTimer:true,collapseDone:true,wakeLock:false,theme:'system',...(JSON.parse(store.get(SETTINGS_KEY)||'{}')||{})}}catch{return{autoTimer:true,collapseDone:true,wakeLock:false,theme:'system'}}}
function loadState(){
 try{
  const raw=store.get(KEY)||store.get(OLD_KEY);
  const s=raw?JSON.parse(raw):{exercises:clone(DEFAULT_EXERCISES),sessions:[],deletedExerciseIds:[]};
  if(!Array.isArray(s.exercises))s.exercises=clone(DEFAULT_EXERCISES);
  if(!Array.isArray(s.sessions))s.sessions=[];
  if(!Array.isArray(s.deletedExerciseIds))s.deletedExerciseIds=[];
  DEFAULT_EXERCISES.forEach(ex=>{if(!s.exercises.some(x=>x.id===ex.id)&&!s.deletedExerciseIds.includes(ex.id))s.exercises.push(clone(ex))});
  s.exercises=s.exercises.map(e=>({...e,sets:Math.max(1,Number(e.sets)||3),rest:Math.max(0,Number(e.rest)||0),days:Array.isArray(e.days)&&e.days.length?e.days:['0','1','2','3','4','5','6']}));
  if(!s.circuitDefs)s.circuitDefs=clone(DEFAULT_CIRCUITS);
  for(const k of ['abs','lower'])s.circuitDefs[k]={...clone(DEFAULT_CIRCUITS[k]),...(s.circuitDefs[k]||{}),items:Array.isArray(s.circuitDefs[k]?.items)?s.circuitDefs[k].items:clone(DEFAULT_CIRCUITS[k].items)};
  return s;
 }catch{return{exercises:clone(DEFAULT_EXERCISES).map(e=>({...e,days:['0','1','2','3','4','5','6']})),sessions:[],deletedExerciseIds:[],circuitDefs:clone(DEFAULT_CIRCUITS)}}
}
let settings=loadSettings(),state=loadState(),today=dateKey(),selectedDate=today,activeTab='today',scrollPositions={today:0,history:0,settings:0};
let session=getSession(selectedDate),saveTimer=null,timerEnd=0,timerId=null,timerLabel='',detailDate=null,sheetMode=null,sheetData=null,wakeLock=null,waitingWorker=null;

function getSession(date){
 let s=state.sessions.find(x=>x.date===date);
 if(!s){s={date,log:{},circuits:{abs:{completed:false,stops:0,note:''},lower:{completed:false,stops:0,note:''}},finished:false};state.sessions.push(s)}
 if(!s.log)s.log={};if(!s.circuits)s.circuits={};for(const k of ['abs','lower'])s.circuits[k]={completed:false,stops:0,note:'',...(s.circuits[k]||{})};
 return s;
}
function applicableExercises(date=selectedDate){const d=dayIndex(date);return state.exercises.filter(e=>['胸','背中','肩','腕'].includes(e.group)&&(!e.days||e.days.includes(d)))}
function getSets(ex,s=session){
 const raw=s.log?.[ex.id],arr=Array.isArray(raw)?raw:(raw?.sets||[]);
 while(arr.length<ex.sets)arr.push({w:Number(ex.weight)||0,r:0,done:false});
 s.log[ex.id]={sets:arr.slice(0,ex.sets)};
 return s.log[ex.id].sets;
}
function exerciseDone(ex,s=session){
 const raw=s.log?.[ex.id],sets=Array.isArray(raw)?raw:(raw?.sets||[]);
 if(s!==session)return sets.length>0&&sets.every(x=>x.done);
 const current=getSets(ex,s);return current.length===ex.sets&&current.every(x=>x.done)
}
function hasData(s){return s.finished||Object.keys(s.log||{}).length||Object.values(s.circuits||{}).some(c=>c.completed||c.stops||c.note)}
function save(){
 clearTimeout(saveTimer);document.getElementById('saveState').classList.remove('show');
 saveTimer=setTimeout(()=>{store.set(KEY,JSON.stringify(state));store.set(SETTINGS_KEY,JSON.stringify(settings));document.getElementById('saveState').classList.add('show');setTimeout(()=>document.getElementById('saveState').classList.remove('show'),900)},120)
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function vibrate(ms=20){try{navigator.vibrate?.(ms)}catch{}}

function applyTheme(){
 const dark= settings.theme==='dark'||(settings.theme==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);
 document.documentElement.dataset.theme=dark?'dark':'light';
 document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]')?.setAttribute('content',dark?'black-translucent':'default');
 document.getElementById('themeValue').textContent={system:'システム',light:'ライト',dark:'ダーク'}[settings.theme];
}
function cycleTheme(){settings.theme=settings.theme==='system'?'light':settings.theme==='light'?'dark':'system';applyTheme();save()}
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',applyTheme);

function selectTab(tab){
 if(activeTab===tab){window.scrollTo({top:0,behavior:'smooth'});return}
 scrollPositions[activeTab]=scrollY;activeTab=tab;
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));

}

 document.getElementById('largeTitle').textContent=titles[activeTab];
 document.getElementById('compactTitle').textContent=titles[activeTab];
 document.getElementById('largeSubtitle').textContent=activeTab==='today'?(selectedDate===today?fmtDate(today):'過去のトレーニングを編集中'):activeTab==='history'?'トレーニング記録':'';

addEventListener('scroll',()=>document.getElementById('appHeader').classList.toggle('compact',scrollY>42),{passive:true});

function render(){
 updateHeader();renderToday();renderHistory();renderSettings();
}
function renderToday(){
 const exs=applicableExercises(),groups=['胸','背中','肩','腕'];
 let done=exs.filter(ex=>exerciseDone(ex)).length;
 const a=session.circuits.abs,l=session.circuits.lower,total=exs.length+2,complete=done+(a.completed?1:0)+(l.completed?1:0),pct=total?Math.round(complete/total*100):0;
 document.getElementById('progressPercent').textContent=pct+'%';document.getElementById('progressBar').style.width=pct+'%';
 document.getElementById('progressDetail').textContent=`${complete} / ${total} 完了`;
 document.getElementById('upperMeta').textContent=`上半身 ${done}/${exs.length}`;document.getElementById('absMeta').textContent=`腹筋 ${a.completed?'✓':'―'}`;document.getElementById('lowerMeta').textContent=`下半身 ${l.completed?'✓':'―'}`;
 const next=exs.find(ex=>!exerciseDone(ex));document.getElementById('nextExercise').textContent=next?`${next.name}・${getSets(next).filter(x=>x.done).length+1}セット目`:!a.completed?state.circuitDefs.abs.name:!l.completed?state.circuitDefs.lower.name:'すべて完了';
 document.getElementById('upperGroups').innerHTML=groups.map(g=>{
  const list=exs.filter(e=>e.group===g);if(!list.length)return'';

 }).join('');
 document.getElementById('circuits').innerHTML=['abs','lower'].map(renderCircuit).join('');
 document.getElementById('finishButton').disabled=complete===0;
}
function renderExercise(ex){
 const sets=getSets(ex),done=exerciseDone(ex),open=!done||!settings.collapseDone;
 const previous=findPrevious(ex.id);
 return `<div class="exercise-row ${done?'done':''} ${open?'open':''}" id="ex-${ex.id}"><button class="exercise-head" onclick="toggleExercise('${ex.id}')"><span class="check-circle">${done?'✓':''}</span><span class="exercise-copy"><b>${esc(ex.name)}</b><small>${sets.filter(x=>x.done).length}/${ex.sets}セット${ex.note?'・'+esc(ex.note):''}</small></span><span class="chevron">›</span></button><div class="exercise-detail">${sets.map((s,i)=>`<div class="set-line ${s.done?'done':''}"><span class="set-number">SET ${i+1}</span>
   ${ex.type==='wr'?stepBox(ex.id,i,'w',s.w,'kg',.5):'<div></div>'}
   ${stepBox(ex.id,i,'r',s.r,'回',1)}
   <button class="set-done" onclick="toggleSet('${ex.id}',${i})">${s.done?'✓':'○'}</button></div>`).join('')}
  ${previous?`<div class="previous">前回 ${fmtDate(previous.date)}：${previous.text}</div>`:''}
  </div></div>`
}
function stepBox(id,i,key,value,unit,step){return `<div class="stepbox"><button onclick="changeValue('${id}',${i},'${key}',-${step})">−</button><input inputmode="${key==='w'?'decimal':'numeric'}" value="${Number(value)||0}" onchange="setValue('${id}',${i},'${key}',this.value)"><button onclick="changeValue('${id}',${i},'${key}',${step})">＋</button></div>`}
function toggleExercise(id){document.getElementById('ex-'+id)?.classList.toggle('open')}
function changeValue(id,i,key,delta){const ex=state.exercises.find(e=>e.id===id),s=getSets(ex)[i];s[key]=Math.max(0,Math.round((Number(s[key]||0)+delta)*10)/10);save();renderToday()}
function setValue(id,i,key,v){const ex=state.exercises.find(e=>e.id===id);getSets(ex)[i][key]=Math.max(0,Number(v)||0);save();renderToday()}
function toggleSet(id,i){
 const ex=state.exercises.find(e=>e.id===id),sets=getSets(ex),was=sets[i].done;sets[i].done=!was;vibrate(18);save();renderToday();
 if(!was&&settings.autoTimer&&ex.rest>0)startTimer(ex.rest,`${ex.name}・次のセット`);
 if(!was&&settings.collapseDone&&exerciseDone(ex)){setTimeout(()=>{document.getElementById('ex-'+id)?.classList.remove('open');document.getElementById('ex-'+id)?.nextElementSibling?.scrollIntoView({behavior:'smooth',block:'center'})},180)}
}
function findPrevious(id){
 const prev=[...state.sessions].filter(s=>s.date<selectedDate&&s.log?.[id]).sort((a,b)=>b.date.localeCompare(a.date))[0];if(!prev)return null;

}
function renderCircuit(key){

 return `<div class="circuit-card"><div class="circuit-head"><div><h3>${esc(d.name)}</h3><p>${d.items.length}種目・${esc(d.description||'最後まで実施')}</p></div><button class="primary-pill ${c.completed?'on':''}" onclick="toggleCircuit('${key}')">${c.completed?'✓ 完走':'完走'}</button></div><div class="stop-box"><span>停止回数</span><div class="stepper"><button onclick="changeStops('${key}',-1)">−</button><b>${c.stops||0}</b><button onclick="changeStops('${key}',1)">＋</button></div></div><textarea class="circuit-note" placeholder="メモを追加" onchange="setCircuitNote('${key}',this.value)">${esc(c.note||'')}</textarea></div>`

function toggleCircuit(k){session.circuits[k].completed=!session.circuits[k].completed;vibrate(22);save();renderToday()}

function finishWorkout(){

 const body=groups.map(g=>{const list=exs.filter(e=>e.group===g);if(!list.length)return'';return `<div class="section-label">${g}</div><div class="group">${list.map(ex=>{const sets=(s.log[ex.id].sets||s.log[ex.id]);return `<div class="hist-ex"><h4>${esc(ex.name)}</h4><div class="hist-chips">${sets.map((x,i)=>`<span class="chip">S${i+1} ${ex.type==='wr'?Number(x.w||0)+'kg・':''}${Number(x.r||0)}回${x.done?' ✓':''}</span>`).join('')}</div></div>`}).join('')}</div>`}).join('');

function openMenuManagerFromData(){document.getElementById('sheetTitle').textContent='上半身メニュー';document.getElementById('sheetBody').innerHTML=`<div class="form-section"><label>種目一覧</label><div class="form-group">${sheetData.map(menuRow).join('')}</div><button class="add-row" onclick="addExercise()">＋ 種目を追加</button></div>`}
function openCircuitManager(k){sheetMode='circuit';sheetData={key:k,data:clone(state.circuitDefs[k])};document.getElementById('sheetTitle').textContent='サーキット編集';renderCircuitForm();openSheet()}
function renderCircuitForm(){const d=sheetData.data;document.getElementById('sheetBody').innerHTML=`<div class="form-section"><label>基本</label><div class="form-group"><div class="form-row"><span>名称</span><input id="cName" value="${esc(d.name)}"></div><div class="form-row"><textarea id="cDesc" placeholder="説明">${esc(d.description||'')}</textarea></div></div></div><div class="form-section"><label>種目一覧</label><div class="form-group" id="circuitRows">${d.items.map((x,i)=>`<div class="circuit-edit-row"><input value="${esc(x)}" oninput="sheetData.data.items[${i}]=this.value"><button onclick="removeCircuitItem(${i})">×</button></div>`).join('')}</div><button class="add-row" onclick="addCircuitItem()">＋ 種目を追加</button></div>`}
function addCircuitItem(){sheetData.data.items.push('');renderCircuitForm()}
function removeCircuitItem(i){sheetData.data.items.splice(i,1);renderCircuitForm()}
function openSheet(){document.getElementById('managerSheet').classList.add('show')}
function closeSheet(){document.getElementById('managerSheet').classList.remove('show');sheetMode=null;sheetData=null}
function sheetBackdrop(e){if(e.target.id==='managerSheet')closeSheet()}
function saveSheet(){
 if(sheetMode==='exercise'){
  const e=sheetData.ex;e.name=document.getElementById('fName').value.trim();e.group=document.getElementById('fGroup').value;e.type=document.getElementById('fType').value;e.sets=Math.max(1,Number(document.getElementById('fSets').value)||3);e.weight=Math.max(0,Number(document.getElementById('fWeight').value)||0);e.rest=Math.max(0,Number(document.getElementById('fRest').value)||0);e.note=document.getElementById('fNote').value.trim();
  if(!e.name||!e.days?.length){alert('種目名と実施曜日を設定してください');return}
  sheetData.list[sheetData.index]=e;state.exercises=sheetData.list;
 }else if(sheetMode==='menu'){state.exercises=sheetData}
 else if(sheetMode==='circuit'){const d=sheetData.data;d.name=document.getElementById('cName').value.trim();d.description=document.getElementById('cDesc').value.trim();d.items=d.items.map(x=>x.trim()).filter(Boolean);if(!d.name||!d.items.length){alert('名称と種目を1つ以上設定してください');return}state.circuitDefs[sheetData.key]=d}
 save();closeSheet();render();toast('保存しました')
}

function playFinishBeep(){
 try{
  const C=window.AudioContext||window.webkitAudioContext,ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sine';o.frequency.setValueAtTime(880,ctx.currentTime);g.gain.setValueAtTime(.0001,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(.16,ctx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.22);
  o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.23);o.onended=()=>ctx.close();
 }catch{}
}

function startTimer(sec,label){stopTimer(false);timerEnd=Date.now()+sec*1000;timerLabel=label;document.getElementById('timer').classList.add('show','compact');tickTimer();timerId=setInterval(tickTimer,250)}
function tickTimer(){const left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));document.getElementById('timerText').textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;document.getElementById('timerNext').textContent=timerLabel||'休憩中';if(left<=0){stopTimer();vibrate([80,60,80]);playFinishBeep();toast('休憩終了')}}
function adjustTimer(sec){timerEnd+=sec*1000;tickTimer()}
function stopTimer(hide=true){clearInterval(timerId);timerId=null;if(hide!==false)document.getElementById('timer').classList.remove('show')}
function toggleTimerExpanded(){document.getElementById('timer').classList.toggle('compact')}

function exportData(){const blob=new Blob([JSON.stringify({version:'3.0.2',state,settings},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`training-log-${dateKey()}.json`;a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.state?.sessions||!x.state?.exercises)throw 0;state=x.state;settings={...settings,...(x.settings||{})};selectedDate=today;session=getSession(today);save();render();toast('読み込みました')}catch{alert('有効なバックアップではありません')}};r.readAsText(f);e.target.value=''}
function resetSelectedDate(){if(!confirm(`${fmtDate(selectedDate)}の入力をリセットしますか？`))return;state.sessions=state.sessions.filter(s=>s.date!==selectedDate);session=getSession(selectedDate);save();render();toast('リセットしました')}

function updateOnline(){document.getElementById('offlineState').classList.toggle('show',!navigator.onLine)}
addEventListener('online',updateOnline);addEventListener('offline',updateOnline);updateOnline();

if('serviceWorker'in navigator){
 navigator.serviceWorker.register('./sw.js').then(reg=>{
  if(reg.waiting){waitingWorker=reg.waiting;document.getElementById('updateBanner').classList.add('show')}
  reg.addEventListener('updatefound',()=>{const w=reg.installing;w?.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){waitingWorker=w;document.getElementById('updateBanner').classList.add('show')}})})
 });
 navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload());
}
function applyUpdate(){if(waitingWorker){store.set(KEY,JSON.stringify(state));waitingWorker.postMessage({type:'SKIP_WAITING'})}}

let touchX=0;
document.getElementById('historyDetail').addEventListener('touchstart',e=>touchX=e.touches[0].clientX,{passive:true});
document.getElementById('historyDetail').addEventListener('touchend',e=>{if(touchX<35&&e.changedTouches[0].clientX-touchX>90)closeHistoryDetail()},{passive:true});
let sheetY=0;
document.getElementById('managerPanel').addEventListener('touchstart',e=>sheetY=e.touches[0].clientY,{passive:true});
document.getElementById('managerPanel').addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-sheetY>120)closeSheet()},{passive:true});

addEventListener('pagehide',()=>{store.set(KEY,JSON.stringify(state));store.set(SETTINGS_KEY,JSON.stringify(settings))});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){store.set(KEY,JSON.stringify(state));store.set(SETTINGS_KEY,JSON.stringify(settings))}});
applyTheme();render();
</script></body></html>
